# Pool of acclaimed books that "Read next" on the taste page is chosen from.
#
# The page picks the books that best fit your reading (your most-read genres and
# how highly you rate them) and skips anything you've read or put in tbr.yml.
# Each entry: title, author, genre (one of TASTE_GENRES in config.py), sources
# (the lists it appeared on). Optional: second_title, isbn, cover_url.
# Refresh this pool once a year, e.g. after the Goodreads Choice and NYT lists.

