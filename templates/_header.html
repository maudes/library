{# Site header shared by every page. `root` is the path back to the site root
   ("", "../" or "../../"); `current` is "library" or "blog". #}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ root }}#top">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H11v16H4.5A1.5 1.5 0 0 1 3 18.5v-13ZM21 5.5c0-.8-.7-1.5-1.5-1.5H13v16h6.5c.8 0 1.5-.7 1.5-1.5v-13Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      Maude's Library
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ root }}#library" {% if current == "library" %}aria-current="page"{% endif %}>My library</a>
      <a href="{{ root }}blog/" {% if current == "blog" %}aria-current="page"{% endif %}>Reading notes</a>
    </nav>
    <button type="button" id="palette-shuffle" class="palette-btn"
            data-palettes="{{ palettes | join(' ') }}"
            aria-label="Shuffle colour palette" title="Shuffle colour palette">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.3 1 4.5 3l2 4c1.2 2 2.5 3 4.5 3H21M18 14l3 3-3 3M3 17h3.5c1.3 0 2.3-.4 3.1-1.2M13.9 8.2C14.7 7.4 15.7 7 17 7h4M18 4l3 3-3 3"/></svg>
      <span class="palette-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <span class="avatar" aria-hidden="true">M</span>
  </div>
</header>
